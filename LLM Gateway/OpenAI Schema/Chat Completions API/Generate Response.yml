info:
  name: Generate Response
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/openai/v1/chat/completions"
  body:
    type: json
    data: |-
      {
        "model": "DEEPSEEK_V4_1_FLASH",
        "reasoning_effort": "xhigh",
        "messages": [
          {
            "role": "developer",
            "content": "Respond in heavy Australian slang."
          },
          {
            "role": "user",
            "content": "What should I have for dinner tonight?"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

